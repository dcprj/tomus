name: CI Tomus (macOS + Windows)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Criar ambiente virtual isolado (macOS)
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> $GITHUB_PATH

      - name: Instalar dependências Python (macOS)
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Executar testes (macOS)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Criar ambiente virtual isolado (Windows)
        shell: pwsh
        run: |
          python -m venv .venv
          Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\.venv\Scripts" -Encoding UTF8

      - name: Instalar dependências Python (Windows)
        shell: pwsh
        run: |
          .\.venv\Scripts\pip install --upgrade pip
          .\.venv\Scripts\pip install -e ".[dev]"

      - name: Executar testes (Windows)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q
