name: CI Tomus (macOS + Windows)

on:
  pull_request:
    branches:
      - develop
      - stage
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detectar alterações relevantes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detectar se há alteração de código (não apenas docs/.md)
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "code_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git fetch origin "${BASE_REF}" --depth=1
          FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || true)
          if echo "$FILES" | grep -vE '^(docs/|.*\.md$)' | grep -q .; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Instalar ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Executar ruff check
        run: |
          ruff check --no-cache src/ tests/

      - name: Validar nomes de arquivo apenas ASCII
        run: |
          python3 -c "import subprocess, sys; bad = [f.decode(\"utf-8\", \"replace\") for f in subprocess.check_output([\"git\", \"ls-files\", \"-z\"]).split(b\"\0\") if any(b > 127 for b in f)]; print(\"NON-ASCII:\", bad); sys.exit(1 if bad else 0)"

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Executar gitleaks
        uses: zricethezav/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build e testes (macOS ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Criar ambiente virtual isolado (macOS)
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> $GITHUB_PATH

      - name: Instalar dependências Python (macOS)
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Executar testes (macOS)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

  build-windows:
    name: Build e testes (Windows ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Criar ambiente virtual isolado (Windows)
        shell: pwsh
        run: |
          python -m venv .venv
          Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}\.venv\Scripts" -Encoding UTF8

      - name: Instalar dependências Python (Windows)
        shell: pwsh
        run: |
          .\.venv\Scripts\pip install --upgrade pip
          .\.venv\Scripts\pip install -e ".[dev]"

      - name: Executar testes (Windows)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, lint, secrets, build-macos, build-windows]
    if: always()
    steps:
      - name: Avaliar gate de CI
        run: |
          LINT_STATUS="${{ needs.lint.result }}"
          CODE_CHANGED="${{ needs.changes.outputs.code_changed }}"
          MACOS_STATUS="${{ needs.build-macos.result }}"
          WINDOWS_STATUS="${{ needs.build-windows.result }}"
          SECRETS_STATUS="${{ needs.secrets.result }}"
          echo "lint=$LINT_STATUS code_changed=$CODE_CHANGED macos=$MACOS_STATUS windows=$WINDOWS_STATUS secrets=$SECRETS_STATUS"
          if [ "$LINT_STATUS" != "success" ]; then
            echo "::error::lint job nao obteve sucesso ($LINT_STATUS)"
            exit 1
          fi
          if [ "$SECRETS_STATUS" != "success" ]; then
            echo "::error::secrets job nao obteve sucesso ($SECRETS_STATUS)"
            exit 1
          fi
          if [ "$CODE_CHANGED" = "true" ]; then
            if [ "$MACOS_STATUS" != "success" ]; then
              echo "::error::build-macos nao obteve sucesso ($MACOS_STATUS)"
              exit 1
            fi
            if [ "$WINDOWS_STATUS" != "success" ]; then
              echo "::error::build-windows nao obteve sucesso ($WINDOWS_STATUS)"
              exit 1
            fi
          fi
          echo "CI Gate aprovado."
