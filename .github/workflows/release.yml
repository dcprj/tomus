name: Release Tomus macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do sistema (macOS)
        run: |
          brew install create-dmg || true

      - name: Criar ambiente virtual isolado
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> $GITHUB_PATH

      - name: Instalar dependências Python
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install pyinstaller

      - name: Executar testes
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

      - name: Build macOS (DMG + .app)
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Smoke check do bundle macOS
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="dist/Tomus.app"
          PYZ_PATH="${APP_PATH}/Contents/PYZ-00.pyz"
          EXE_PATH="${APP_PATH}/Contents/MacOS/Tomus"
          FRAMEWORKS_DIR="${APP_PATH}/Contents/Frameworks"

          echo "=== Smoke check: verifica ausência de pyi_rth_pkgres e pkg_resources ==="
          if .venv/bin/python - <<'PY'
import sys
from PyInstaller.archive.readers import CArchiveReader

# 1. pyi_rth_pkgres não deve estar no binário (CArchive).
# arch.toc é um dict de chaves string: verificar chave diretamente.
arch = CArchiveReader("dist/Tomus.app/Contents/MacOS/Tomus")
if "pyi_rth_pkgres" in arch.toc:
    print("FALHA: pyi_rth_pkgres encontrado no CArchive")
    sys.exit(1)
print("OK: pyi_rth_pkgres ausente do CArchive")

# 2. pkg_resources não deve estar no PYZ (via CArchive quando existe PYZ separado,
# ou integrado no executável com exclude_binaries=True no macOS).
try:
    pyz = arch.open_embedded_archive("PYZ-00.pyz")
except Exception:
    pyz = None
if pyz is not None:
    for key in pyz.toc.keys():
        if key == "pkg_resources" or key.startswith("pkg_resources."):
            print("FALHA: pkg_resources encontrado no PYZ")
            sys.exit(1)
    print("OK: pkg_resources ausente do PYZ")
else:
    print("AVISO: PYZ-00.pyz não encontrado como arquivo separado (normal em macOS com exclude_binaries=True); pkg_resources verificado apenas no CArchive")
PY
          then
            echo "Smoke check (pkgres) passou"
          else
            echo "Smoke check (pkgres) FALHOU" && exit 1
          fi

          echo "=== Smoke check: libavcodec em Contents/Frameworks ==="
          if ls "${FRAMEWORKS_DIR}"/libavcodec* >/dev/null 2>&1; then
            echo "OK: libavcodec presente em Contents/Frameworks"
          else
            echo "FALHA: libavcodec não encontrado em Contents/Frameworks" && exit 1
          fi

          echo "=== Smoke check: docling_slim dist-info coletado ==="
          if find "${APP_PATH}" -iname "docling_slim*" -path "*dist-info*" 2>/dev/null | grep -q .; then
            echo "OK: docling_slim dist-info presente no bundle"
          else
            echo "FALHA: docling_slim dist-info não encontrado no bundle" && exit 1
          fi

          echo "=== Smoke check: boot offscreen do executável Tomus por 5s ==="
          if QT_QPA_PLATFORM=offscreen .venv/bin/python - <<'PY'
import subprocess
import sys
import os

exe = "dist/Tomus.app/Contents/MacOS/Tomus"
env = dict(os.environ)
env["QT_QPA_PLATFORM"] = "offscreen"

p = subprocess.Popen([exe], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, env=env)
try:
    out, _ = p.communicate(timeout=5)
    # Saiu antes de 5s: falha
    print(f"FALHA: executável encerrou antes de 5s (rc={p.returncode})")
    print(out)
    sys.exit(1)
except subprocess.TimeoutExpired:
    # Permaneceu vivo por 5s: sucesso
    p.terminate()
    try:
        out, _ = p.communicate(timeout=2)
    except subprocess.TimeoutExpired:
        p.kill()
        out, _ = p.communicate()
    bad = ("Traceback", "ImportError", "AttributeError", "SIGABRT")
    for token in bad:
        if token in out:
            print(f"FALHA: encontrou '{token}' no boot offscreen")
            print(out)
            sys.exit(1)
    print("OK: executável Tomus rodou 5s offscreen sem erro")
PY
          then
            echo "Smoke check (boot) passou"
          else
            echo "Smoke check (boot) FALHOU" && exit 1
          fi

      - name: Listar artifacts gerados
        shell: bash
        run: |
          echo "=== Arquivos em dist/ ==="
          ls -la dist/ 2>/dev/null || echo "dist/ não encontrado"

      - name: Upload artifact (macOS DMG)
        uses: actions/upload-artifact@v4
        with:
          name: tomus-macos-dmg
          path: dist/*.dmg
          retention-days: 30

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar artifacts (macOS DMG)
        uses: actions/download-artifact@v4
        with:
          name: tomus-macos-dmg
          path: release-assets/macos

      - name: Listar assets disponíveis para release
        run: |
          echo "=== Assets disponíveis ==="
          ls -la release-assets/macos/ 2>/dev/null || true

      - name: Criar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
