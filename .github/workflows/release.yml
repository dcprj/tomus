name: Release Tomus (macOS + Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do sistema (macOS)
        run: |
          brew install create-dmg || true

      - name: Criar ambiente virtual isolado
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> $GITHUB_PATH

      - name: Instalar dependências Python
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install pyinstaller

      - name: Executar testes
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -m "not slow" -q

      - name: Build macOS (DMG + .app)
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Smoke check do bundle macOS
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python packaging/smoke_check_macos.py

      - name: Listar artifacts gerados
        shell: bash
        run: |
          echo "=== Arquivos em dist/ ==="
          ls -la dist/ 2>/dev/null || echo "dist/ não encontrado"

      - name: Upload artifact (macOS DMG)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tomus-macos-dmg
          path: dist/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Garantir Inno Setup (ISCC.exe)
        run: |
          $iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $paths = @(
              "C:\Program Files\Inno Setup 7\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            )
            $found = $false
            foreach ($p in $paths) {
              if (Test-Path $p) {
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "ISCC.exe não encontrado; instalando Inno Setup via choco..."
              choco install innosetup -y --no-progress
            }
          }

      - name: Criar ambiente virtual isolado
        run: |
          python -m venv .venv
          echo "${GITHUB_WORKSPACE}\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Instalar dependências Python
        run: |
          .\.venv\Scripts\pip install --upgrade pip
          .\.venv\Scripts\pip install -e '.[dev]'
          .\.venv\Scripts\pip install pyinstaller

      - name: Executar testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\.venv\Scripts\pytest.exe tests/ -m 'not slow' -q

      - name: Build Windows (PyInstaller + Inno Setup)
        run: |
          .\packaging\build_windows.ps1

      - name: Listar artifacts gerados
        run: |
          echo "=== Arquivos em dist/ ==="
          if (Test-Path dist) { Get-ChildItem -Force dist } else { echo "dist/ não encontrado" }

      - name: Upload artifact (Windows installer)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tomus-windows-installer
          path: dist/Tomus_Setup_*.exe
          retention-days: 30

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar consistência de versão (tag vs pyproject.toml)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          EXPECTED_TAG="v${PY_VERSION}"
          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Erro: tag '$TAG_NAME' não corresponde à versão do pyproject.toml '$PY_VERSION' (esperado '$EXPECTED_TAG')"
            exit 1
          fi
          echo "OK: tag '$TAG_NAME' corresponde à versão do pyproject.toml '$PY_VERSION'"

      - name: Baixar artifacts (macOS DMG)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tomus-macos-dmg
          path: release-assets/macos

      - name: Baixar artifacts (Windows installer)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tomus-windows-installer
          path: release-assets/windows

      - name: Listar assets disponíveis para release
        run: |
          echo "=== Assets disponíveis ==="
          ls -la release-assets/macos/ 2>/dev/null || true
          ls -la release-assets/windows/ 2>/dev/null || true

      - name: Gerar SHA256SUMS.txt (nomes relativos, verificáveis pelo usuário)
        run: |
          # Gere apenas nomes de arquivo base (basename) para que o usuário
          # possa verificar com `sha256sum -c SHA256SUMS.txt` quando os assets
          # baixados e este arquivo estão no mesmo diretório. Caminhos
          # completos (release-assets/macos/...) quebram a verificação do
          # usuário final. Preserva compatibilidade macOS (.dmg) e Windows (.exe).
          # `tr -d '\r'` remove qualquer CR residual (defensivo em runners
          # Windows/CRLF) para que o sha256sum -c não trate o '\r' como parte
          # do nome do arquivo (ex.: 'asset.exe\r').
          {
            cd release-assets/macos && sha256sum *.dmg
            cd ../windows && sha256sum *.exe
          } | tr -d '\r' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Criar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-assets/macos/*.dmg
            release-assets/windows/*.exe
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
