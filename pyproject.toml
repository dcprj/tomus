[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomus"
version = "1.4.3"
description = "Tomus — Organizador Acadêmico de PDFs baseado na taxonomia CAPES/CNPq"
requires-python = ">=3.11"
authors = [
    { name = "Dario" },
]
dependencies = [
    "pymupdf",
    "opencv-python-headless>=4.5.1.48,<4.11",
    "rapidocr",
    "onnxruntime",
    "httpx",
    "tenacity",
    "rapidfuzz",
    "python-stdnum",
    "pydantic>=2.5,<3",
    "pydantic-settings",
    "google-genai",
    "typer",
    "rich",
    "tomli-w",
    "pyside6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[project.scripts]
tomus = "tomus.cli.main:app"

[project.gui-scripts]
tomus-gui = "tomus.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tomus"]

[tool.pytest.ini_options]
markers = [
    "slow: testes lentos sobre o repositorio de referencia",
]
filterwarnings = [
    "ignore::FutureWarning:google.*",
    "ignore::FutureWarning:fitz.*",
    "ignore:.*urllib3 v2 only supports OpenSSL.*",
    "ignore::DeprecationWarning:.*SwigPy.*",
    "ignore::DeprecationWarning:.*swigvarlink.*",
]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "PIE", "S110", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tomus/cli/main.py" = ["B008", "E402"]
"src/tomus/core/models.py" = ["UP042", "PIE796"]
